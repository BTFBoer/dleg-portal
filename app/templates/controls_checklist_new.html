{% extends "base.html" %}
{% block content %}

<h1 class="h3">Controlepunt toevoegen</h1>
<p class="text-muted">Dossier {{ case.dossier_nr }} – {{ case.applicant_name }}</p>

<form method="post" action="/cases/{{ case.id }}/controls/checklist/new" class="row g-3">
  <div class="col-md-8">
    <label class="form-label">Controlepunt</label>
    <input class="form-control" name="control_point" placeholder="Google check in dossier?">
  </div>
  <div class="col-md-4">
    <label class="form-label">Resultaat</label>
    <select class="form-select" name="result">
      <option value="N.v.t.">N.v.t.</option>
      <option value="Ja">Ja</option>
      <option value="Nee">Nee</option>
    </select>
  </div>

  <div class="col-md-4">
    <label class="form-label">Behandelaar</label>
    <input class="form-control" name="handler_name" value="{{ case.handler_name }}">
  </div>
  <div class="col-md-8">
    <label class="form-label">Toelichting</label>
    <input class="form-control" name="notes" placeholder="optioneel">
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Opslaan</button>
    <a class="btn btn-link" href="/cases/{{ case.id }}">Terug</a>
  </div>
</form>

{% endblock %}
