{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Nieuw dossier</h1>
<form method="post" action="/cases/new" class="row g-3">
  <div class="col-lg-8">
    <div class="card mb-3"><div class="card-body">
      <div class="section-title">Gegevens aanvraag</div>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Dossiernummer</label><input class="form-control" name="dossier_nr" required></div>
        <div class="col-md-4"><label class="form-label">Rapportnummer</label><input class="form-control" name="report_number"></div>
        <div class="col-md-4"><label class="form-label">Klantnummer</label><input class="form-control" name="client_number"></div>
        <div class="col-md-4"><label class="form-label">Geldverstrekker</label><input class="form-control" name="lender_name" list="lenders" required><datalist id="lenders">{% for l in lenders %}<option value="{{ l }}">{% endfor %}</datalist></div>
        <div class="col-md-3"><label class="form-label">Soort aanvraag</label><select class="form-select" name="case_type"><option>IKV</option><option>Inkomensanalyse</option><option>Overig</option></select></div>
        <div class="col-md-2"><label class="form-label">NHG</label><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="with_nhg" value="true" id="with_nhg"><label class="form-check-label" for="with_nhg">Ja</label></div></div>
        <div class="col-md-3"><label class="form-label">Type ondernemer</label><select class="form-select" name="entrepreneur_type"><option value="IB">IB</option><option value="DGA">DGA</option></select></div>
        <div class="col-md-3"><label class="form-label">Behandelaar</label><input class="form-control" name="handler_name"></div>
        <div class="col-md-3"><label class="form-label">Fiatteur</label><input class="form-control" name="approver_name"></div>
        <div class="col-md-3"><label class="form-label">Berekeningsdatum</label><input class="form-control" type="date" name="calculation_date"></div>
        <div class="col-md-3"><label class="form-label">Geldigheid t/m</label><input class="form-control" type="date" name="validity_until"></div>
        <div class="col-md-3"><label class="form-label">Jaren ondernemer</label><select class="form-select" name="years_category"><option value=">=3">≥ 3 jaar</option><option value="1-3">1–3 jaar</option><option value="<1">&lt; 1 jaar</option></select></div>
        <div class="col-md-9"><label class="form-label">Toelichting categorie</label><input class="form-control" name="years_category_reason" placeholder="bijv. rechtsvormwijziging of loondiensthistorie"></div>
      </div>
    </div></div>

    <div class="card mb-3"><div class="card-body">
      <div class="section-title">Gegevens aanvrager</div>
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Achternaam</label><input class="form-control" name="applicant_lastname"></div>
        <div class="col-md-2"><label class="form-label">Tussenvoegsel</label><input class="form-control" name="applicant_prefix"></div>
        <div class="col-md-3"><label class="form-label">Voorletters</label><input class="form-control" name="applicant_initials"></div>
        <div class="col-md-2"><label class="form-label">Geslacht</label><input class="form-control" name="applicant_gender"></div>
        <div class="col-md-2"><label class="form-label">Geboortedatum</label><input class="form-control" type="date" name="applicant_dob"></div>
        <div class="col-md-4"><label class="form-label">Geboorteplaats</label><input class="form-control" name="applicant_birth_place"></div>
        <div class="col-md-8"><label class="form-label">Weergavenaam</label><input class="form-control" name="applicant_name" placeholder="Wordt automatisch opgebouwd"></div>
        <div class="col-md-5"><label class="form-label">Straat</label><input class="form-control" name="applicant_street"></div>
        <div class="col-md-2"><label class="form-label">Huisnr</label><input class="form-control" name="applicant_house_number"></div>
        <div class="col-md-2"><label class="form-label">Postcode</label><input class="form-control" name="applicant_postcode"></div>
        <div class="col-md-3"><label class="form-label">Woonplaats</label><input class="form-control" name="applicant_city"></div>
        <div class="col-md-4"><label class="form-label">Telefoon</label><input class="form-control" name="applicant_phone"></div>
        <div class="col-md-8"><label class="form-label">E-mail</label><input class="form-control" name="applicant_email"></div>
      </div>
    </div></div>

    <div class="card mb-3"><div class="card-body">
      <div class="section-title">Intermediair / beoordeling</div>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Intermediair</label><input class="form-control" name="intermediary_office_name"></div>
        <div class="col-md-2"><label class="form-label">AFM</label><input class="form-control" name="intermediary_afm_number"></div>
        <div class="col-md-3"><label class="form-label">Contactpersoon</label><input class="form-control" name="intermediary_contact_name"></div>
        <div class="col-md-3"><label class="form-label">Telefoon</label><input class="form-control" name="intermediary_phone"></div>
        <div class="col-md-6"><label class="form-label">E-mail intermediair</label><input class="form-control" name="intermediary_email"></div>
        <div class="col-md-3"><label class="form-label">Beoordelingsveld</label><select class="form-select" name="assessment_result"><option value=""></option><option>Akkoord</option><option>Voorleggen</option><option>Niet akkoord</option><option>Definitief akkoord</option></select></div>
        <div class="col-md-3"><label class="form-label">Fallback belang %</label><input class="form-control" type="number" step="0.01" name="share_pct" value="100"></div>
        <div class="col-12"><label class="form-label">Toelichting / Exposé</label><textarea class="form-control" rows="4" name="expose_text"></textarea></div>
        <div class="col-md-6"><label class="form-label">Expert Judgement</label><textarea class="form-control" rows="4" name="assessment_notes"></textarea></div>
        <div class="col-md-6"><label class="form-label">Dossiernotities</label><textarea class="form-control" rows="4" name="notes"></textarea></div>
      </div>
    </div></div>
  </div>
  <div class="col-lg-4">
    <div class="card sticky-actions"><div class="card-body">
      <div class="section-title">Opslaan</div>
      <div class="form-help mb-3">Na opslaan kun je onderneming(en), balans/V&amp;W/IB, documenten, controlepunten en berekeningen toevoegen.</div>
      <button class="btn btn-primary w-100 mb-2">Dossier aanmaken</button>
      <a class="btn btn-outline-secondary w-100" href="/">Annuleren</a>
    </div></div>
  </div>
</form>
{% endblock %}
