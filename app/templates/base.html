<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'IKV Portal' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="/">IKV Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/cases/new">Nieuw dossier</a></li>
        <li class="nav-item"><a class="nav-link" href="/cases/search">Zoeken</a></li>
        <li class="nav-item"><a class="nav-link" href="/policies">Policies</a></li>
      </ul>
      <span class="navbar-text small text-light-emphasis">Dossier → Onderneming → Balans/V&W/IB → Berekenen → Rapport</span>
    </div>
  </div>
</nav>

<main class="container-fluid my-4 px-4 px-lg-5">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function updateApplicantDisplayName(prefix) {
  const root = document;
  const initials = root.querySelector(`${prefix} [name='applicant_initials']`) || root.querySelector("[name='applicant_initials']");
  const tussen = root.querySelector(`${prefix} [name='applicant_prefix']`) || root.querySelector("[name='applicant_prefix']");
  const last = root.querySelector(`${prefix} [name='applicant_lastname']`) || root.querySelector("[name='applicant_lastname']");
  const display = root.querySelector(`${prefix} [name='applicant_name']`) || root.querySelector("[name='applicant_name']");
  if (!display || display.dataset.manual === '1') return;
  const parts = [initials?.value || '', tussen?.value || '', last?.value || ''].filter(Boolean);
  display.value = parts.join(' ').replace(/\s+/g, ' ').trim();
}

document.addEventListener('input', function(ev){
  if (['applicant_initials','applicant_prefix','applicant_lastname'].includes(ev.target.name)) {
    updateApplicantDisplayName('');
  }
  if (ev.target.name === 'applicant_name') {
    ev.target.dataset.manual = ev.target.value ? '1' : '0';
  }
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
